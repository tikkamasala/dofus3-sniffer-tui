name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap (Linux target)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install mingw-w64 and Npcap SDK (Windows cross-compile)
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          curl -sSL https://npcap.com/dist/npcap-sdk-1.13.zip -o /tmp/npcap-sdk.zip
          unzip -q /tmp/npcap-sdk.zip -d /tmp/npcap-sdk
          {
            echo "CC=x86_64-w64-mingw32-gcc"
            echo "CGO_LDFLAGS=-L/tmp/npcap-sdk/Lib/x64"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/sniffer${{ matrix.ext }}" ./cmd/sniffer

      - name: Stage release files
        run: |
          stage="dofus3-sniffer-tui-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "dist/sniffer${{ matrix.ext }}" "$stage/"
          cp README.md "$stage/"
          echo "STAGE_DIR=$stage" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: zip -r "${STAGE_DIR}.zip" "$STAGE_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dofus3-sniffer-tui-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
